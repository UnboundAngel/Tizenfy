<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="TV Remote" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>TizenSpotify Remote</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Unbounded:wght@300;700;900&display=swap" rel="stylesheet" />

  <style>
    :root {
      --green: #1DB954;
      --green-dim: #158a3e;
      --bg: #0a0a0a;
      --surface: #141414;
      --surface2: #1c1c1c;
      --border: #2a2a2a;
      --text: #f0f0f0;
      --text-dim: #666;
      --red: #e84040;
      --btn-size: 72px;
      --btn-radius: 20px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      overflow: hidden;
      user-select: none;
    }

    body {
      display: flex;
      flex-direction: column;
      padding: env(safe-area-inset-top, 20px) env(safe-area-inset-right, 16px) env(safe-area-inset-bottom, 20px) env(safe-area-inset-left, 16px);
      gap: 0;
    }

    /* ── STATUS BAR ── */
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0 8px;
      flex-shrink: 0;
    }

    .app-title {
      font-family: 'Unbounded', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: var(--green);
      text-transform: uppercase;
    }

    .connection-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--red);
      transition: background 0.4s;
      box-shadow: 0 0 0 0 var(--red);
    }

    .connection-dot.connected {
      background: var(--green);
      animation: pulse 2s infinite;
      box-shadow: 0 0 0 0 var(--green);
    }

    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(29,185,84,0.5); }
      70%  { box-shadow: 0 0 0 6px rgba(29,185,84,0); }
      100% { box-shadow: 0 0 0 0 rgba(29,185,84,0); }
    }

    /* ── NOW PLAYING ── */
    .now-playing {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px 18px;
      margin: 8px 0;
      flex-shrink: 0;
      min-height: 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .now-playing::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(29,185,84,0.04) 0%, transparent 60%);
      pointer-events: none;
    }

    .track-label {
      font-size: 9px;
      letter-spacing: 0.2em;
      color: var(--text-dim);
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .track-name {
      font-family: 'Unbounded', sans-serif;
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
    }

    .artist-name {
      font-size: 12px;
      color: var(--text-dim);
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ad-badge {
      display: none;
      position: absolute;
      top: 12px;
      right: 14px;
      background: var(--red);
      color: #fff;
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.1em;
      padding: 3px 8px;
      border-radius: 20px;
      text-transform: uppercase;
    }

    .ad-badge.visible { display: block; }

    /* ── CONTROLS GRID ── */
    .controls {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      justify-content: center;
      overflow: hidden;
    }

    .row {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    /* ── BUTTONS ── */
    .btn {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--btn-radius);
      color: var(--text);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      height: var(--btn-size);
      width: var(--btn-size);
      position: relative;
      transition: background 0.12s, transform 0.1s, border-color 0.12s;
      -webkit-touch-callout: none;
      touch-action: manipulation;
      flex-shrink: 0;
    }

    .btn:active {
      background: var(--surface2);
      transform: scale(0.93);
      border-color: #3a3a3a;
    }

    .btn.wide {
      width: calc(var(--btn-size) * 2 + 10px);
    }

    .btn.green {
      background: var(--green);
      border-color: var(--green);
      color: #000;
    }

    .btn.green:active { background: var(--green-dim); }

    .btn svg {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
    }

    .btn.green svg { color: #000; }

    .btn-label {
      font-size: 8px;
      letter-spacing: 0.08em;
      color: var(--text-dim);
      text-transform: uppercase;
      line-height: 1;
    }

    .btn.green .btn-label { color: rgba(0,0,0,0.6); }

    /* ── VOLUME SLIDER ── */
    .volume-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 4px;
      flex-shrink: 0;
    }

    .vol-icon { color: var(--text-dim); flex-shrink: 0; }

    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      flex: 1;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      outline: none;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--green);
      cursor: pointer;
    }

    /* ── CONNECTING SCREEN ── */
    .connecting {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 100;
      transition: opacity 0.4s;
    }

    .connecting.hidden { opacity: 0; pointer-events: none; }

    .connecting-title {
      font-family: 'Unbounded', sans-serif;
      font-size: 18px;
      font-weight: 900;
      color: var(--green);
    }

    .connecting-sub {
      font-size: 12px;
      color: var(--text-dim);
      text-align: center;
      line-height: 1.6;
      max-width: 260px;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── IP INPUT ── */
    .ip-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      max-width: 280px;
      align-items: center;
    }

    .ip-input {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 16px;
      padding: 14px 16px;
      text-align: center;
      width: 100%;
      outline: none;
      letter-spacing: 0.05em;
    }

    .ip-input:focus { border-color: var(--green); }

    .connect-btn {
      background: var(--green);
      border: none;
      border-radius: 12px;
      color: #000;
      cursor: pointer;
      font-family: 'Unbounded', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.1em;
      padding: 14px 24px;
      width: 100%;
      transition: background 0.12s, transform 0.1s;
    }

    .connect-btn:active { background: var(--green-dim); transform: scale(0.97); }

    .ip-hint {
      font-size: 10px;
      color: var(--text-dim);
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <!-- Connecting / IP entry screen -->
  <div class="connecting" id="connectingScreen">
    <div class="connecting-title">TIZEN REMOTE</div>
    <div class="ip-form">
      <input
        class="ip-input"
        id="tvIpInput"
        type="text"
        inputmode="numeric"
        placeholder="TV IP (e.g. 10.0.0.X)"
        autocomplete="off"
      />
      <button class="connect-btn" id="connectBtn">CONNECT</button>
    </div>
    <div class="ip-hint">
      Find your TV's IP in<br/>
      Settings → Network → Network Status
    </div>
  </div>

  <!-- Status bar -->
  <div class="status-bar">
    <span class="app-title">TV Remote</span>
    <div class="connection-dot" id="dot"></div>
  </div>

  <!-- Now playing -->
  <div class="now-playing">
    <div class="track-label">Now Playing</div>
    <div class="track-name" id="trackName">—</div>
    <div class="artist-name" id="artistName">Not connected</div>
    <div class="ad-badge" id="adBadge">Ad</div>
  </div>

  <!-- Main controls -->
  <div class="controls">

    <!-- Row 1: Prev / Play-Pause / Next -->
    <div class="row">
      <button class="btn" id="btnPrev" data-action="prev">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
        <span class="btn-label">Prev</span>
      </button>
      <button class="btn green wide" id="btnPlay" data-action="playpause">
        <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <span class="btn-label">Play / Pause</span>
      </button>
      <button class="btn" id="btnNext" data-action="next">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zm2-8.14 5.09 3.64L8 17.14V9.86zM16 6h2v12h-2z"/></svg>
        <span class="btn-label">Next</span>
      </button>
    </div>

    <!-- Row 2: Shuffle / Like / Repeat -->
    <div class="row">
      <button class="btn" data-action="shuffle">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10.59 9.17 5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
        <span class="btn-label">Shuffle</span>
      </button>
      <button class="btn" data-action="like">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        <span class="btn-label">Like</span>
      </button>
      <button class="btn" data-action="repeat">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
        <span class="btn-label">Repeat</span>
      </button>
    </div>

    <!-- Row 3: Home / Queue / Search -->
    <div class="row">
      <button class="btn" data-action="home">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        <span class="btn-label">Home</span>
      </button>
      <button class="btn" data-action="queue">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15 6H3v2h12V6zm0 4H3v2h12v-2zM3 16h8v-2H3v2zM17 6v8.18c-.31-.11-.65-.18-1-.18-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3V8h3V6h-5z"/></svg>
        <span class="btn-label">Queue</span>
      </button>
      <button class="btn" data-action="search">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <span class="btn-label">Search</span>
      </button>
    </div>

    <!-- Volume -->
    <div class="volume-row">
      <svg class="vol-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <path d="M18.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM5 9v6h4l5 5V4L9 9H5z"/>
      </svg>
      <input type="range" id="volumeSlider" min="0" max="10" value="7" step="1" />
      <svg class="vol-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
      </svg>
    </div>

  </div>

  <script>
    // ─── STATE ───────────────────────────────────────────────────────────────
    let ws = null;
    let tvIP = localStorage.getItem('tizenSpotifyIP') || '';
    let connected = false;
    let lastVolume = 7;
    let isPlaying = false;

    // ─── ELEMENTS ────────────────────────────────────────────────────────────
    const connectingScreen = document.getElementById('connectingScreen');
    const tvIpInput = document.getElementById('tvIpInput');
    const connectBtn = document.getElementById('connectBtn');
    const dot = document.getElementById('dot');
    const trackName = document.getElementById('trackName');
    const artistName = document.getElementById('artistName');
    const adBadge = document.getElementById('adBadge');
    const playIcon = document.getElementById('playIcon');
    const volumeSlider = document.getElementById('volumeSlider');

    // ─── CONNECT ─────────────────────────────────────────────────────────────
    function connect(ip) {
      if (ws) { try { ws.close(); } catch(e){} }

      connectBtn.textContent = 'CONNECTING...';

      ws = new WebSocket(`ws://${ip}:8765`);

      ws.onopen = () => {
        connected = true;
        localStorage.setItem('tizenSpotifyIP', ip);
        dot.classList.add('connected');
        connectingScreen.classList.add('hidden');
        ws.send(JSON.stringify({ type: 'register', role: 'remote' }));
      };

      ws.onmessage = (event) => {
        let msg;
        try { msg = JSON.parse(event.data); } catch(e) { return; }
        if (msg.type === 'status') updateStatus(msg);
      };

      ws.onclose = () => {
        connected = false;
        dot.classList.remove('connected');
        connectingScreen.classList.remove('hidden');
        connectBtn.textContent = 'CONNECT';
        artistName.textContent = 'Disconnected';
        // Auto-reconnect after 3s if we had a saved IP
        if (tvIP) setTimeout(() => connect(tvIP), 3000);
      };

      ws.onerror = () => {
        connectBtn.textContent = 'RETRY';
      };
    }

    function sendCommand(action) {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({ type: 'command', action }));
      // Haptic feedback on supported iPhones
      if (navigator.vibrate) navigator.vibrate(10);
    }

    // ─── STATUS UPDATE ───────────────────────────────────────────────────────
    function updateStatus(msg) {
      trackName.textContent = msg.track || '—';
      artistName.textContent = msg.artist || '—';
      isPlaying = msg.isPlaying;

      // Swap play/pause icon
      playIcon.innerHTML = isPlaying
        ? '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'  // pause
        : '<path d="M8 5v14l11-7z"/>';                      // play

      // Ad badge
      adBadge.classList.toggle('visible', !!msg.isAd);
    }

    // ─── BUTTON CLICKS ───────────────────────────────────────────────────────
    document.querySelectorAll('[data-action]').forEach(btn => {
      btn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        sendCommand(btn.dataset.action);
      });
      // Fallback for non-touch
      btn.addEventListener('click', () => sendCommand(btn.dataset.action));
    });

    // ─── VOLUME SLIDER ───────────────────────────────────────────────────────
    volumeSlider.addEventListener('input', () => {
      const val = parseInt(volumeSlider.value);
      const delta = val - lastVolume;
      if (delta > 0) { for (let i = 0; i < delta; i++) sendCommand('volumeup'); }
      else if (delta < 0) { for (let i = 0; i < Math.abs(delta); i++) sendCommand('volumedown'); }
      lastVolume = val;
    });

    // ─── CONNECT BUTTON ──────────────────────────────────────────────────────
    connectBtn.addEventListener('click', () => {
      const ip = tvIpInput.value.trim();
      if (ip) { tvIP = ip; connect(ip); }
    });

    tvIpInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') connectBtn.click();
    });

    // ─── AUTO-CONNECT IF IP SAVED ────────────────────────────────────────────
    if (tvIP) {
      tvIpInput.value = tvIP;
      connect(tvIP);
    }
  </script>
</body>
</html>
